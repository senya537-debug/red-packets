name: Delete old branches (one-off)
# Removes merged work branches that still point at the old repository history,
# so the old objects can be garbage-collected. Only the explicit list below is touched.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete listed branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in average-from-total best-topic daily-report deep-tags diagnostics/discovery-funnel \
            fewer-commits fix/global-square-discovery fix/telegram-original-recheck-backoff probe-search \
            radar-expected-reward-v1 radar-expiry-countdown radar-expiry-priority radar-global-quality-v1 \
            radar-original-detail-fields radar-special-detail-audit revert-average-fallback revert-deep-tags \
            small-public-feed squash-once-a-day state-branch-history total-and-competition \
            usd-equivalent-rewards watchdog; do
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" >/dev/null 2>&1; then
              echo "deleted $b"
            else
              echo "skip $b (already gone or not allowed)"
            fi
          done
