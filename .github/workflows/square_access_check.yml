                (f.completed_at ? f.coverage_limited ? 'достигнут публичный предел 100 страниц, полный список недоступен' : 'обход завершён' : 'следующая страница '+f.next_page)+
                '; первые 2 страницы обновляются при каждом запуске автора. История авторов сохранена.',env);
            }
            if(snapshot.discovery_stats)summary('Поиск авторов: '+JSON.stringify(snapshot.discovery_stats),env);
            const textCodes=(snapshot.other_candidates||[]).filter(p=>p.kind==='code');
            summary('Коды в текстах Square: '+JSON.stringify({posts_with_codes:textCodes.length,
              fresh:textCodes.filter(p=>isEligiblePost(p)).length,
              outside_freshness_window:textCodes.filter(p=>!isEligiblePost(p)).length}),env);
