                if(snapshot.all_sources_failed)throw new Error('All worker sources failed');
                summary('Предпросмотр: очередь и Telegram не изменены.',env);
                for(const candidate of orderDeliveryCandidates(publishCandidates(snapshot)).slice(0,10))console.log(JSON.stringify({
                  kind:candidate.post.kind,url:candidate.post.url,codes:candidate.post.published_codes}));
                return snapshot;
