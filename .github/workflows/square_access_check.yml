            if(WORKER_ROLES.includes(role))return runSearchWorker(env,role,mode);
            if(role!=='publisher')throw new Error('Unknown worker role');
            if(mode==='preview')return;
            const stats=await runQueuePublisher(env,mode);
            summary('## Telegram\n\n'+JSON.stringify(stats,null,2),env);
            if(stats.last_error)process.exitCode=1;
          }
