            const authorsChanged=JSON.stringify(authors)!==JSON.stringify(state.authors||[]);
            state.authors=authors;
            const followingChanged=snapshot.following_sync!==undefined &&
              JSON.stringify(snapshot.following_sync)!==JSON.stringify(state.following_sync);
            if(snapshot.following_sync!==undefined)state.following_sync=snapshot.following_sync;
