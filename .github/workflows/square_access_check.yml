              await storage.save(state,result.ok ? 'sent' : 'delivery not confirmed');
              index=deliveryIndex(state,destination);
              if (!result.ok) break;
              if (attempted<MAX_POSTS_PER_RUN) await wait(1100);
            }
            stats.enabled=state.enabled_destination===destination;
            stats.pending_uncertain=Object.entries(state.items).filter(([key,item])=>key.startsWith(destination+':')&&item.state==='uncertain').length;
            stats.pending_uncertain_posts=Object.entries(state.items)
              .filter(([key,item])=>key.startsWith(destination+':')&&item.state==='uncertain').slice(0,5)
              .map(([key,item])=>({post_id:item.post_id||null,
                url:/^\d+$/.test(String(item.post_id||'')) ?
                  (key.slice(destination.length+1).startsWith('live:') ? 'https://www.binance.com/en/square/audio?id=' :
                    'https://www.binance.com/en/square/post/')+item.post_id : null,
                updated_at:iso(item.updated_at)}));
            return stats;
          }
          export async function main(env=process.env) {
            const mode=env.RUN_MODE||'preview';
            if (!['preview','telegram_test','publish','scheduled'].includes(mode)) throw new Error('Unknown run mode');
            const snapshot=mode==='telegram_test' ? {reported_open:[],other_candidates:[]} : await scan(env);
            if (mode!=='telegram_test') summary('## Binance Square\n\n'+snapshot.sources.map(s=>`${s.tag}: ${s.ok ? s.coverage==='disabled_by_configuration' ? 'отключено' : 'OK, posts '+s.posts_checked+(s.excluded_without_original!==undefined ? '; без оригинала исключено '+s.excluded_without_original+'; оригиналов проверено '+s.originals_checked : '') : s.error}`).join('\n\n'),env);
            if (mode!=='telegram_test') {
              const eligible=publishCandidates(snapshot),fromTelegram=eligible.filter(c=>c.post.discovery_kind==='telegram'||c.post.source_kind==='telegram').length;
              const live=eligible.filter(c=>c.post.kind==='live').length,marker=snapshot.sources.find(s=>s.local_processing);
              summary(`\nКандидаты: посты Square ${eligible.length-fromTelegram-live}; эфиры со значком пакета ${live}; через Telegram с проверенным оригиналом ${fromTelegram}. Приоритет: 4 Square (включая один эфир) + 1 Telegram, свободные места заполняются остальными. Коды Telegram без оригинала исключены.\nПоиск в загруженных лентах: совпадений ${marker?.matched_posts||0}; проверено оригиналов ${marker?.posts_checked||0}; найдены пакеты/коды ${marker?.verified_packets_or_codes||0}. Ошибки глобального поиска указаны отдельно выше.`,env);
            }
            if (mode==='preview') {
              if(snapshot.all_sources_failed)throw new Error('Both Square feeds failed');
              const items=publishCandidates(snapshot);
              summary(`\nEligible candidates: ${items.length}. No messages sent.`,env);
              for(const {post} of orderDeliveryCandidates(items).slice(0,5)) console.log(JSON.stringify({kind:post.kind,status:post.status,url:post.url,codes:post.published_codes,question:post.question,hint:post.hint,title:post.title}));
              return;
            }
            const stats=await publish(snapshot,env,mode);
            summary('\n## Telegram\n\n'+JSON.stringify(stats,null,2),env);
            if(stats.last_error)process.exitCode=1;
          }
          
          await main().catch(error=>{summary('ERROR: '+redact(error,process.env),process.env);process.exitCode=1;});
