          export function writeSearchResult(snapshot,env,worker,status='done',error=null) {
            if(!WORKER_ROLES.includes(worker))throw new Error('Unknown search worker');
            if(!env.SQUARE_RESULT_DIR)throw new Error('SQUARE_RESULT_DIR is required for read-only search output');
            const directory=env.SQUARE_RESULT_DIR.replace(/\/$/,'');
            fs.mkdirSync(directory,{recursive:true});
            const file=directory+'/'+worker+'.json',temporary=file+'.tmp';
            const result={version:1,run_id:String(env.GITHUB_RUN_ID||'local'),run_attempt:String(env.GITHUB_RUN_ATTEMPT||'1'),
              worker,status,updated_at:Date.now(),snapshot,...(error?{error:redact(error,env)}:{})};
            fs.writeFileSync(temporary,JSON.stringify(result));fs.renameSync(temporary,file);
            return {worker,status,eligible_candidates:publishCandidates(snapshot).length,local_result:true};
          }
          export async function importSearchResults(env,wait=WAIT) {
            if(!env.SQUARE_RESULT_DIR)return {imported:[],errors:[]};
            const imported=[],errors=[],directory=env.SQUARE_RESULT_DIR.replace(/\/$/,'');
            for(const worker of WORKER_ROLES) {
              let result;
              try {
                const file=directory+'/'+worker+'.json',stat=fs.lstatSync(file);
                if(!stat.isFile() || stat.size>25*1024*1024)throw new Error('Invalid search result file');
                result=JSON.parse(fs.readFileSync(file,'utf8'));
                const currentAttempt=Number(env.GITHUB_RUN_ATTEMPT||1),attempt=Number(result.run_attempt);
                if(result.version!==1 || result.worker!==worker || result.run_id!==String(env.GITHUB_RUN_ID||'local') ||
                  !Number.isSafeInteger(attempt) || attempt<1 || attempt>currentAttempt ||
                  !['done','failed'].includes(result.status) || !result.snapshot || typeof result.snapshot!=='object' || Array.isArray(result.snapshot))
                  throw new Error('Search result does not match this workflow run');
                for(const field of ['reported_open','other_candidates','live_candidates','packet_authors'])
                  if(result.snapshot[field]!==undefined && !Array.isArray(result.snapshot[field]))throw new Error('Invalid search result '+field);
              } catch(error) {
                const message=redact(error,env);errors.push({worker,error:message});
                summary('Результат поиска '+worker+' недоступен: '+message,env);
