            totals.pending_uncertain=0;totals.pending_uncertain_posts=[];
            for(const target of targets) {
              const prefix=target.destination+':';
              for(const [key,item] of Object.entries(latest.items))if(key.startsWith(prefix)&&item.state==='uncertain') {
                totals.pending_uncertain++;
