            if (!['group','supergroup'].includes(body.result?.type) || !/^-\d+$/.test(String(body.result.id))) throw new Error('TG_CHAT_ID must identify a Telegram group or supergroup');
            return String(body.result.id);
          }
          async function sendMessage(env,chatId,message) {
            try {
              const response=await fetch(`https://api.telegram.org/bot${env.TG_BOT_TOKEN}/sendMessage`,{
                method:'POST',redirect:'error',signal:AbortSignal.timeout(10000),headers:{'Content-Type':'application/json'},
                body:JSON.stringify({...message,chat_id:chatId,...(env.TG_THREAD_ID ? {message_thread_id:Number(env.TG_THREAD_ID)} : {})})});
              let body;
              try {body=await response.json();} catch {return {ok:false,uncertain:true,error:'Telegram response not readable; check delivery manually'};}
              if (response.ok && body.ok && body.result?.message_id) return {ok:true,message_id:String(body.result.message_id)};
              if (body.ok===false && response.status<500) return {ok:false,uncertain:false,
                retry_ms:Math.max(1,Number(body.parameters?.retry_after)||300)*1000,error:redact(body.description||'Telegram rejected message',env)};
              return {ok:false,uncertain:true,error:'Telegram did not confirm delivery; check group manually'};
            } catch {return {ok:false,uncertain:true,error:'Network or timeout; check group before retrying'};}
          }
          export async function publish(snapshot,env,mode,wait=WAIT) {
            config(env);
            const chatId=await resolveGroup(env);
            const destination=createHash('sha256').update(JSON.stringify([chatId,env.TG_THREAD_ID||''])).digest('hex');
            const storage=new GitHubState(env), state=await storage.load();
            const stats={sent:0,skipped:0,uncertain:0,last_error:null,skip_reasons:{}};
            const skip=reason=>{stats.skipped++;stats.skip_reasons[reason]=(stats.skip_reasons[reason]||0)+1;};
            if (mode==='scheduled' && state.enabled_destination!==destination) return {...stats,disabled:true,reason:'Run publish manually once to enable this group'};
            if (mode!=='telegram_test' && snapshot.all_sources_failed) throw new Error('Both Square feeds failed; no messages sent');
            if (mode==='publish') state.enabled_destination=destination;
            const authors=mergeAuthors(Array.isArray(state.authors)?state.authors:[],snapshot.packet_authors||[]);
            const authorsChanged=JSON.stringify(authors)!==JSON.stringify(state.authors||[]);
            state.authors=authors;
            const markerChecksChanged=snapshot.keyword_checks!==undefined && JSON.stringify(snapshot.keyword_checks)!==JSON.stringify(state.keyword_checks||{});
            if(snapshot.keyword_checks!==undefined)state.keyword_checks=snapshot.keyword_checks;
            // A preceding job may have reached Telegram before losing its acknowledgment.
            let recovered=false;
            for (const [key,item] of Object.entries(state.items)) {
              if (key.startsWith(destination+':') && item.state==='sending') {
                item.state='uncertain';item.updated_at=Date.now();item.error='Previous job interrupted; check delivery manually';
                recovered=true;
              }
            }
            const allCandidates=mode==='telegram_test'
              ? [{key:'test:'+(env.GITHUB_RUN_ID||'local'),message:{text:'🧧 Бот Red Packet подключён.\nЭто тестовое сообщение. Автопубликация включается отдельным запуском publish.'}}]
              : orderDeliveryCandidates(publishCandidates(snapshot)).slice(0,100).map(item=>({...item,message:formatTelegramPost(item.post)}));
            let index=deliveryIndex(state,destination),identitiesChanged=false;
            // Extend old records when their posts reappear; never clear delivery history.
            for(const candidate of allCandidates) {
              for(const key of matchingDeliveries(index,candidate)) {
                const item=state.items[key],aliases=[...new Set([...(item.identity_keys||[]),...candidateIdentityKeys(candidate)])];
                if(JSON.stringify(aliases)!==JSON.stringify(item.identity_keys||[])) {
                  item.identity_keys=aliases;identitiesChanged=true;
                }
              }
            }
            index=deliveryIndex(state,destination);
            // Also confirms that persistence works before any Telegram message is attempted.
            if (mode==='publish' || mode==='telegram_test' || Date.now()-(state.last_check_at||0)>86400000 ||
                recovered || authorsChanged || identitiesChanged || markerChecksChanged) {
              state.last_check_at=Date.now();await storage.save(state,'check and recover');
            }
            index=deliveryIndex(state,destination);
            const ready=allCandidates.filter(candidate=>{
              const reason=deliverySkipReason(state,matchingDeliveries(index,candidate));
              if(reason){skip(reason);return false;}return true;
            });
            const candidates=orderDeliveryCandidates(ready);
            let attempted=0;
            for (const candidate of candidates) {
              if (attempted>=MAX_POSTS_PER_RUN) break;
              if (candidate.post && !isEligiblePost(candidate.post)) continue;
              if (candidate.post?.expires_at && Date.parse(candidate.post.expires_at)<=Date.now()) continue;
              index=deliveryIndex(state,destination);
              const matches=matchingDeliveries(index,candidate);
              const blockedReason=deliverySkipReason(state,matches);
              if (blockedReason) {skip(blockedReason);continue;}
              const key=matches[0]||destination+':'+candidate.key;
              const claimId=randomUUID();
              state.items[key]={state:'sending',claim_id:claimId,post_id:candidate.post?.post_id||null,
                identity_keys:candidateIdentityKeys(candidate),updated_at:Date.now()};
              await storage.save(state,'claim before send');
              index=deliveryIndex(state,destination);
              const claim=state.items[key];
              if(claim?.state!=='sending' || claim.claim_id!==claimId) {skip('competing_claim');continue;}
              if(deliveryBlocked(state,matchingDeliveries(index,candidate).filter(other=>other!==key))) {
                claim.state='queued';claim.retry_at=Date.now()+60000;claim.updated_at=Date.now();
                await storage.save(state,'duplicate claim avoided');
                index=deliveryIndex(state,destination);skip('duplicate_identity');continue;
              }
              if(mode!=='telegram_test' && state.enabled_destination!==destination)
                throw new Error('Telegram destination changed during state update; publishing stopped');
              if(candidate.post?.kind==='live') {
                try {
                  const current=await refreshLive(candidate.post);
                  if(!current) {
                    state.items[key].state='queued';state.items[key].retry_at=Date.now()+60000;state.items[key].updated_at=Date.now();
                    await storage.save(state,'live ended or badge hidden');skip('live_ended_or_badge_hidden');continue;
                  }
                  candidate.post=current;candidate.message=formatTelegramPost(current);
                } catch(error) {
                  state.items[key].state='queued';state.items[key].retry_at=Date.now()+60000;
                  state.items[key].error=redact(error,env);state.items[key].updated_at=Date.now();
                  await storage.save(state,'live check failed before send');skip('live_check_failed');
                  stats.live_check_error=redact(error,env);continue;
                }
              }
              // Persistence can take time; enforce freshness again immediately before Telegram.
              if (candidate.post && (!isEligiblePost(candidate.post) ||
                  (candidate.post.expires_at && Date.parse(candidate.post.expires_at)<=Date.now()))) {
                state.items[key].state='skipped_stale';state.items[key].updated_at=Date.now();
                await storage.save(state,'post became too old before send');skip('became_stale');continue;
              }
              attempted++;
              const result=await sendMessage(env,chatId,candidate.message);
              const item=state.items[key];item.updated_at=Date.now();
              if (result.ok) {item.state='sent';item.message_id=result.message_id;stats.sent++;}
              else {
                item.state=result.uncertain ? 'uncertain' : 'queued';
                item.retry_at=Date.now()+(result.retry_ms||300000);item.error=result.error;
                stats.last_error=result.error;if(result.uncertain)stats.uncertain++;
