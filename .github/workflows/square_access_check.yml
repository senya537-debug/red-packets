# GitHub: replace .github/workflows/square_access_check.yml with this file.
# Repository Secrets: TG_BOT_TOKEN, TG_CHAT_ID. Optional: TG_THREAD_ID.
# Run telegram_test first. Run publish manually to enable automatic posting.
# Preview and test never enable the schedule. No Binance account/API keys needed.
# Deduplication state is saved in .redpacket/delivery.json before sending.
# Public state contains hashed destination, post IDs and delivery status, no tokens.
# Uncertain sends are not automatically repeated; check the group before resetting.
# Standard Ubuntu runner in a public repository; schedule may be delayed/dropped.
# Only posts published within the last 10 minutes are eligible, including quizzes.
name: Red Packets to Telegram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = findings; telegram_test = test bot; publish = enable posting"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - telegram_test
          - publish
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: square-telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find packets and post to Telegram
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const TAGS = ["redpacket", "redpacketgiveawaycampaign"];
          const ENDPOINT = "https://www.binance.com/bapi/composite/v4/friendly/pgc/content/queryByHashtag";
          const PAGE_SIZE = 20;
          const MAX_POSTS_PER_RUN = 5;
          const POST_MAX_AGE_MS = 10 * 60 * 1000;
          
          function epoch(value) {
            const n = Number(value);
            return Number.isFinite(n) && n > 0 ? (n < 1e12 ? n * 1000 : n) : null;
          }
          function iso(value) { const n = epoch(value); return n ? new Date(n).toISOString() : null; }
          function codesFrom(text) {
            // Published candidates only; no guessing. All-letter codes are supported.
            const candidates = new Set();
            const label = /(?:red\s*packet\s*code|crypto\s*box\s*code|код(?:\s+(?:пакета|ред\s*пакета))?|c[oó]digo|code)\s*[:：=\-]\s*[`'"*]*(?![A-Za-z0-9]{9})([A-Za-z0-9]{8})\b/giu;
            for (const m of text.matchAll(label)) candidates.add(m[1]);
            if (/red\s*packet|crypto\s*box|红包|ред\s*пакет|sobre\s*rojo/i.test(text)) {
              for (const line of text.split(/\r?\n/)) {
                const m = line.trim().match(/^[`'"*]*([A-Za-z0-9]{8})[`'"*]*$/);
                if (m) candidates.add(m[1]);
              }
            }
            return [...candidates];
          }
          function packetState(envelope, now) {
            if (!envelope) return "unverified_code";
            if (envelope.isRunOut === true) return "run_out";
            if (envelope.isExpired === true || (epoch(envelope.expiredTime) && epoch(envelope.expiredTime) <= now)) return "expired";
            if (envelope.isExpired === false && envelope.isRunOut === false) return "reported_open";
            return "unknown";
          }
          export function normalize(post, tag, now = Date.now()) {
            if (!post || typeof post !== "object" || !/^\d+$/.test(String(post.id || ""))) return null;
            const text = typeof post.content === "string" ? post.content : "";
            const envelope = post.redEnvelop && typeof post.redEnvelop === "object" ? post.redEnvelop : null;
            const codes = codesFrom(text);
            if (!envelope && !codes.length) return null;
            const quiz = envelope?.quiz || "";
            const answerMatch = text.match(/(?:^|\n)\s*(?:ans(?:wer)?|ответ|respuesta)\s*[:：]\s*([^\n]{1,120})/i);
            return {
              post_id: String(post.id),
              author: post.authorName || post.username || "",
              author_id: post.squareAuthorId || "",
              url: `https://www.binance.com/en/square/post/${post.id}`,
              published_at: iso(post.date),
              sources: [tag],
              kind: envelope ? (envelope.type === 1 || quiz ? "quiz" : "packet") : "code",
              status: packetState(envelope, now),
              currency: envelope?.currency || null,
              expires_at: iso(envelope?.expiredTime),
              question: quiz,
              hint: envelope?.answerHint || "",
              answer_from_metadata: envelope?.answer ?? null,
              answer_claimed_in_post: answerMatch ? answerMatch[1].trim() : null,
              answer_verified: false,
              published_codes: codes,
              // null stays null: an unavailable reward amount is never treated as zero.
              amount: envelope?.amount ?? null,
              available_amount: envelope?.availableAmount ?? null,
              available_receivers: envelope?.availableNumber ?? null,
              eligibility: "not_checked",
              excerpt: text.slice(0, 240),
            };
          }
          async function fetchTag(tag) {
            const url = new URL(ENDPOINT);
            url.search = new URLSearchParams({hashtag: `#${tag}`, pageIndex: "1", pageSize: String(PAGE_SIZE), orderBy: "LATEST"});
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            try {
              const response = await fetch(url, {
                headers: {
                  Accept: "application/json, text/plain, */*",
                  "Accept-Language": "en-US,en;q=0.9",
                  Referer: `https://www.binance.com/en/square/hashtag/${tag}`,
                  clienttype: "web",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36",
                },
                signal: controller.signal,
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const payload = await response.json();
              if (payload.success !== true || !Array.isArray(payload.data?.feedData)) {
                throw new Error("Square response changed or public access is unavailable");
              }
              return payload.data.feedData;
            } finally { clearTimeout(timer); }
          }
          export async function scan() {
            const now = Date.now();
            const results = await Promise.allSettled(TAGS.map(fetchTag));
            const posts = new Map();
            const sourceChecks = [];
            for (let i = 0; i < results.length; i++) {
              const result = results[i], tag = TAGS[i];
              if (result.status !== "fulfilled") {
                sourceChecks.push({tag, ok: false, error: String(result.reason?.message || result.reason)});
                continue;
              }
              const feed = result.value;
              const dates = feed.map(p => epoch(p.date)).filter(Boolean);
              sourceChecks.push({tag, ok: true, posts_checked: feed.length,
                newest_post_at: dates.length ? iso(Math.max(...dates)) : null,
                oldest_post_at: dates.length ? iso(Math.min(...dates)) : null,
                coverage: "first_latest_page_only", may_have_more: feed.length === PAGE_SIZE});
              for (const post of feed) {
                const item = normalize(post, tag, now);
                if (!item) continue;
                const previous = posts.get(item.post_id);
                if (previous) {
                  // If source responses disagree, retain an observed ended state.
                  const ended = ["expired", "run_out"];
                  if (ended.includes(item.status)) previous.status = item.status;
                  previous.sources = [...new Set([...previous.sources, tag])].sort();
                } else posts.set(item.post_id, item);
              }
            }
            const items = [...posts.values()].sort((a,b) => (Date.parse(b.published_at) || 0) - (Date.parse(a.published_at) || 0));
            const statusCounts = {};
            for (const p of items) statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
            return {checked_at: new Date(now).toISOString(), sources: sourceChecks,
              partial: sourceChecks.some(s => !s.ok), all_sources_failed: sourceChecks.every(s => !s.ok),
              total_unique_candidates: items.length, status_counts: statusCounts,
              reported_open: items.filter(p => p.status === "reported_open"),
              other_candidates: items.filter(p => p.status !== "reported_open"),
              limitations: ["Discovery only; no reward claimed", "Hints are not verified answers",
                "Public Square endpoint is undocumented and can change", "Only 20 latest posts per tag; incomplete during high traffic"],
              storage_enabled: false};
          }
          function clipped(value, limit) { return [...String(value ?? "")].slice(0, limit).join(""); }
          function escapeHtml(value, limit = 300) {
            return clipped(value, limit).replace(/&/g,"&amp;").replace(/</g,"&lt;")
              .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
          }
          export function formatTelegramPost(post) {
            if (!/^https:\/\/www\.binance\.com\/en\/square\/post\/\d+$/.test(post.url || "")) {
              throw new Error("Invalid Square post URL");
            }
            const lines = [`🧧 <b>Red Packet${post.currency ? " · " + escapeHtml(post.currency,24) : ""}</b>`,
              `👤 ${escapeHtml(post.author || "Автор Square",80)}`];
            if (post.kind === "quiz") {
              lines.push("", "📝 <b>Викторина</b>");
              if (post.question) lines.push(`❓ ${escapeHtml(post.question,400)}`);
              if (post.hint) lines.push(`💡 Подсказка: <code>${escapeHtml(post.hint,160)}</code>`);
              const answer = post.answer_from_metadata ?? post.answer_claimed_in_post;
              if (answer !== null && answer !== undefined && String(answer) !== "") {
                lines.push(`📌 Указанный ответ: <code>${escapeHtml(answer,160)}</code> (не проверен)`);
              }
              if (!post.hint && !answer) lines.push("Ответ пока не найден.");
            }
            if (post.published_codes?.length) {
              lines.push("", ...post.published_codes.slice(0,5).map(code => `🎟 Код: <code>${escapeHtml(code,24)}</code>`));
            }
            if (post.amount !== null && post.amount !== undefined) {
              lines.push(`💰 Общая сумма пакета: ${escapeHtml(post.amount,40)} ${escapeHtml(post.currency || "",24)}`);
            } else lines.push("💰 Размер награды неизвестен");
            lines.push("", post.status === "reported_open"
              ? "По данным Square: пакет не истёк и не разобран."
              : "Код опубликован в Square; работоспособность не проверена.");
            if (post.kind === "quiz") lines.push("Подсказка и ответ ещё не проверены получением пакета.");
            if (post.published_at) {
              lines.push(`🕒 ${escapeHtml(post.published_at.replace("T"," ").replace(/\.\d{3}Z$/, " UTC"),40)}`);
            }
            lines.push("", `<a href="${post.url}">Открыть пост в Binance</a>`);
            return {text: lines.join("\n"), parse_mode: "HTML", link_preview_options: {is_disabled: true},
              reply_markup: {inline_keyboard: [[{text: "🧧 Открыть в Binance", url: post.url}]]}};
          }
          export function isFreshPost(post, now = Date.now()) {
            const published = Date.parse(post?.published_at);
            return Number.isFinite(published) && published <= now + 60000 && now - published <= POST_MAX_AGE_MS;
          }
          export function publishCandidates(snapshot, now = Date.now()) {
            const unique = new Map();
            const recent = [...(snapshot.reported_open || []), ...(snapshot.other_candidates || [])]
              .filter(post => isFreshPost(post, now))
              .sort((a,b) => Date.parse(b.published_at) - Date.parse(a.published_at));
            for (const post of recent) {
              if (post.status === "reported_open" && !(post.expires_at && Date.parse(post.expires_at) <= now)) {
                unique.set(`post:${post.post_id}`, {key: `post:${post.post_id}`, post});
              } else if (post.kind === "code" && post.status === "unverified_code") {
                for (const code of post.published_codes || []) {
                  // Same published code across different posts is sent once to this destination.
                  const key = `code:${code}`;
                  if (!unique.has(key)) unique.set(key, {key, post: {...post, published_codes: [code]}});
                }
              }
            }
            return [...unique.values()];
          }
          
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          
          const STATE_PATH = '.redpacket/delivery.json';
          const WAIT = ms => new Promise(resolve => setTimeout(resolve,ms));
          function redact(value,env) {
            let text = String(value?.message || value);
            for (const name of ['TG_BOT_TOKEN','TG_CHAT_ID','GH_STATE_TOKEN']) {
              if (env[name]) text = text.split(env[name]).join('[REDACTED]');
            }
            return text.replace(/bot\d+:[A-Za-z0-9_-]+/g,'bot[REDACTED]').slice(0,300);
          }
          function summary(text,env) {
            const safe = redact(text,env);
            console.log(safe);
            if (env.GITHUB_STEP_SUMMARY) fs.appendFileSync(env.GITHUB_STEP_SUMMARY,safe+'\n');
          }
          class GitHubState {
            constructor(env) {
              if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(env.GITHUB_REPOSITORY || '') || !env.GITHUB_REF_NAME || !env.GH_STATE_TOKEN) {
                throw new Error('GitHub state configuration missing');
              }
              this.env=env; this.sha=null;
              this.url=`https://api.github.com/repos/${env.GITHUB_REPOSITORY}/contents/${STATE_PATH}`;
            }
            async request(method,body,accept='application/vnd.github.object+json') {
              const url = method==='GET' ? this.url+'?ref='+encodeURIComponent(this.env.GITHUB_REF_NAME) : this.url;
              return fetch(url, {method, redirect:'error', signal:AbortSignal.timeout(20000),
                headers:{Accept:accept,Authorization:'Bearer '+this.env.GH_STATE_TOKEN,
                  'X-GitHub-Api-Version':'2026-03-10','User-Agent':'SquareTelegramPublisher','Content-Type':'application/json'},
                ...(body ? {body:JSON.stringify(body)} : {})});
            }
            async load() {
              const response=await this.request('GET');
              if (response.status===404) return {version:1,items:{},enabled_destination:null};
              if (!response.ok) throw new Error('GitHub state read: HTTP '+response.status);
              const metadata=await response.json();
              if (metadata.type!=='file' || !metadata.sha) throw new Error('Unexpected GitHub state file');
              this.sha=metadata.sha;
              let content;
              if (metadata.encoding==='base64') content=Buffer.from(metadata.content,'base64').toString('utf8');
              else if (metadata.encoding==='none') {
                const raw=await this.request('GET',null,'application/vnd.github.raw+json');
                if (!raw.ok) throw new Error('GitHub raw state read: HTTP '+raw.status);
                content=await raw.text();
              } else throw new Error('Unexpected GitHub state encoding');
              const state=JSON.parse(content);
              if (state.version!==1 || !state.items || Array.isArray(state.items) || typeof state.items!=='object') throw new Error('State damaged; refusing to resend');
              return state;
            }
            async save(state,reason) {
              const response=await this.request('PUT',{
                message:`Red Packet delivery: ${reason} [skip ci]`, branch:this.env.GITHUB_REF_NAME,
                content:Buffer.from(JSON.stringify(state)).toString('base64'), ...(this.sha ? {sha:this.sha} : {})});
              if (!response.ok) throw new Error('GitHub state write: HTTP '+response.status+'; publishing stopped');
              const result=await response.json();
              if (!result.content?.sha) throw new Error('GitHub did not confirm state persistence; publishing stopped');
              this.sha=result.content.sha;
            }
          }
          function config(env) {
            if (!/^\d+:[A-Za-z0-9_-]{20,}$/.test(env.TG_BOT_TOKEN || '')) throw new Error('Add repository Secret TG_BOT_TOKEN from BotFather');
            if (!/^(?:-\d+|@[A-Za-z][A-Za-z0-9_]{4,})$/.test(env.TG_CHAT_ID || '')) throw new Error('Add repository Secret TG_CHAT_ID: group ID or public @username');
            if (env.TG_THREAD_ID && !/^[1-9]\d*$/.test(env.TG_THREAD_ID)) throw new Error('TG_THREAD_ID must be a positive integer');
          }
          async function resolveGroup(env) {
            const response=await fetch(`https://api.telegram.org/bot${env.TG_BOT_TOKEN}/getChat`,{
              method:'POST',redirect:'error',signal:AbortSignal.timeout(10000),
              headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:env.TG_CHAT_ID})});
            const body=await response.json();
            if (!response.ok || !body.ok) throw new Error(body.description || 'Telegram getChat failed');
            if (!['group','supergroup'].includes(body.result?.type) || !/^-\d+$/.test(String(body.result.id))) throw new Error('TG_CHAT_ID must identify a Telegram group or supergroup');
            return String(body.result.id);
          }
          async function sendMessage(env,chatId,message) {
            try {
              const response=await fetch(`https://api.telegram.org/bot${env.TG_BOT_TOKEN}/sendMessage`,{
                method:'POST',redirect:'error',signal:AbortSignal.timeout(10000),headers:{'Content-Type':'application/json'},
                body:JSON.stringify({...message,chat_id:chatId,...(env.TG_THREAD_ID ? {message_thread_id:Number(env.TG_THREAD_ID)} : {})})});
              let body;
              try {body=await response.json();} catch {return {ok:false,uncertain:true,error:'Telegram response not readable; check delivery manually'};}
              if (response.ok && body.ok && body.result?.message_id) return {ok:true,message_id:String(body.result.message_id)};
              if (body.ok===false && response.status<500) return {ok:false,uncertain:false,
                retry_ms:Math.max(1,Number(body.parameters?.retry_after)||300)*1000,error:redact(body.description||'Telegram rejected message',env)};
              return {ok:false,uncertain:true,error:'Telegram did not confirm delivery; check group manually'};
            } catch {return {ok:false,uncertain:true,error:'Network or timeout; check group before retrying'};}
          }
          export async function publish(snapshot,env,mode,wait=WAIT) {
            config(env);
            const chatId=await resolveGroup(env);
            const destination=createHash('sha256').update(JSON.stringify([chatId,env.TG_THREAD_ID||''])).digest('hex');
            const storage=new GitHubState(env), state=await storage.load();
            const stats={sent:0,skipped:0,uncertain:0,last_error:null};
            if (mode==='scheduled' && state.enabled_destination!==destination) return {...stats,disabled:true,reason:'Run publish manually once to enable this group'};
            if (mode!=='telegram_test' && snapshot.all_sources_failed) throw new Error('Both Square feeds failed; no messages sent');
            if (mode==='publish') state.enabled_destination=destination;
            // A preceding job may have reached Telegram before losing its acknowledgment.
            let recovered=false;
            for (const [key,item] of Object.entries(state.items)) {
              if (key.startsWith(destination+':') && item.state==='sending') {
                item.state='uncertain';item.updated_at=Date.now();item.error='Previous job interrupted; check delivery manually';
                recovered=true;
              }
            }
            // Also confirms that persistence works before any Telegram message is attempted.
            if (mode==='publish' || mode==='telegram_test' || Date.now()-(state.last_check_at||0)>86400000 ||
                recovered) {
              state.last_check_at=Date.now();await storage.save(state,'check and recover');
            }
            const candidates=mode==='telegram_test'
              ? [{key:'test:'+(env.GITHUB_RUN_ID||'local'),message:{text:'🧧 Бот Red Packet подключён.\nЭто тестовое сообщение. Автопубликация включается отдельным запуском publish.'}}]
              : publishCandidates(snapshot).slice(0,100).map(item=>({...item,message:formatTelegramPost(item.post)}));
            let attempted=0;
            for (const candidate of candidates) {
              if (attempted>=MAX_POSTS_PER_RUN) break;
              if (candidate.post && !isFreshPost(candidate.post)) continue;
              if (candidate.post?.expires_at && Date.parse(candidate.post.expires_at)<=Date.now()) continue;
              const key=destination+':'+candidate.key, old=state.items[key];
              if (old && (old.state!=='queued' || old.retry_at>Date.now())) {stats.skipped++;continue;}
              state.items[key]={state:'sending',post_id:candidate.post?.post_id||null,updated_at:Date.now()};
              await storage.save(state,'claim before send');
              // Persistence can take time; enforce freshness again immediately before Telegram.
              if (candidate.post && (!isFreshPost(candidate.post) ||
                  (candidate.post.expires_at && Date.parse(candidate.post.expires_at)<=Date.now()))) {
                state.items[key].state='skipped_stale';state.items[key].updated_at=Date.now();
                await storage.save(state,'post became too old before send');stats.skipped++;continue;
              }
              attempted++;
              const result=await sendMessage(env,chatId,candidate.message);
              const item=state.items[key];item.updated_at=Date.now();
              if (result.ok) {item.state='sent';item.message_id=result.message_id;stats.sent++;}
              else {
                item.state=result.uncertain ? 'uncertain' : 'queued';
                item.retry_at=Date.now()+(result.retry_ms||300000);item.error=result.error;
                stats.last_error=result.error;if(result.uncertain)stats.uncertain++;
              }
              // If this write fails, the persistent claim remains sending and is not resent.
              await storage.save(state,result.ok ? 'sent' : 'delivery not confirmed');
              if (!result.ok) break;
              if (attempted<MAX_POSTS_PER_RUN) await wait(1100);
            }
            stats.enabled=state.enabled_destination===destination;
            stats.pending_uncertain=Object.entries(state.items).filter(([key,item])=>key.startsWith(destination+':')&&item.state==='uncertain').length;
            return stats;
          }
          export async function main(env=process.env) {
            const mode=env.RUN_MODE||'preview';
            if (!['preview','telegram_test','publish','scheduled'].includes(mode)) throw new Error('Unknown run mode');
            const snapshot=mode==='telegram_test' ? {reported_open:[],other_candidates:[]} : await scan();
            if (mode!=='telegram_test') summary('## Binance Square\n\n'+snapshot.sources.map(s=>`${s.tag}: ${s.ok ? 'OK, posts '+s.posts_checked : s.error}`).join('\n\n'),env);
            if (mode!=='telegram_test') summary(`\nСвежесть: не старше 10 минут. Подходящих находок: ${publishCandidates(snapshot).length}. Старые публикации не отправляются.`,env);
            if (mode==='preview') {
              if(snapshot.all_sources_failed)throw new Error('Both Square feeds failed');
              const items=publishCandidates(snapshot);
              summary(`\nFresh candidates (last 10 minutes): ${items.length}. No messages sent.`,env);
              for(const {post} of items.slice(0,5)) console.log(JSON.stringify({kind:post.kind,status:post.status,url:post.url,codes:post.published_codes,question:post.question,hint:post.hint}));
              return;
            }
            const stats=await publish(snapshot,env,mode);
            summary('\n## Telegram\n\n'+JSON.stringify(stats,null,2),env);
            if(stats.last_error)process.exitCode=1;
          }
          
          await main().catch(error=>{summary('ERROR: '+redact(error,process.env),process.env);process.exitCode=1;});
          JS
