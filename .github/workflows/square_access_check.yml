# GitHub: replace .github/workflows/square_access_check.yml with this file.
# Repository Secrets: TG_BOT_TOKEN, TG_CHAT_ID. Optional: TG_THREAD_ID (legacy), TG_RU_THREAD_ID and TG_EN_THREAD_ID (both for RU/EN topics).
# RU keeps the existing delivery history; EN has a separate receipt namespace. Questions, answers and codes stay original.
# Run telegram_test first. Run publish manually to enable automatic posting.
# Preview and test never enable the schedule. No Binance account/API keys needed.
# Deduplication history stays in .redpacket/delivery.json; it is never reset. Claims are persisted before sending.
# Public state contains hashed destination, post IDs and delivery status, no tokens.
# Only failures proven to precede the HTTP request retry (up to 3 attempts). Ambiguous sends stay blocked.
# Telegram uses fresh IPv4 TLS connections; no HTTP payload is written until TLS is ready.
# Old uncertain records are preserved; historical error text is not proof of non-delivery.
# Read-only API calls retry transient failures; errors identify the API and underlying network cause.
# GitHub 5xx/408, network failures and missing write acknowledgments reconcile fresh history before retrying.
# Up to 3 transient write attempts (5 total with conflicts); a confirmed committed write is not repeated.
# Telegram sends are never blindly retried; sent and uncertain receipts remain protected.
# State writes retry conflicts with a three-way merge and recheck the delivery claim.
# Public following list for Aleks8234 is imported 4 pages per run and saved in delivery state.
# Standard Ubuntu runner in a public repository; schedule may be delayed/dropped.
# Text codes: last 10 minutes of the original Square post only.
# Quiz/Claim cards hide codes. Standalone code cards have no Binance link or button.
# Envelope grabCode is an internal identity, never a displayed standalone code.
# Square quizzes/Claim: require open flags and a future expiry, regardless of post age.
# Reads both public feed types, recommendations, 8 hashtags and discovered authors outside the loaded following list.
# Discovery uses Binance Square plus public Gate Live countdowns. Telegram is the delivery destination.
# Gate packets stay queued until the final 5 minutes before start_at; already-open packets are skipped.
# Gate rechecks room, packet ID and countdown before sending; no Gate credentials or claims.
# GitHub scheduling/startup delays mean a delivery time cannot be guaranteed.
# Author worker: up to 256 profiles; 128 recent packet publishers + 64 discoveries + 64 following.
# Recent publishers become due every 2 minutes; vacant slots are reused; 150-second scan budget.
# Four requests at a time per worker; feed/profile budgets reserve time for original and live checks.
# Search reads the checked-out state snapshot; the publisher uses conditional GitHub reads.
# Five read-only search jobs export run-scoped artifacts; only the serialized publisher writes delivery.json.
# Publisher imports all available worker artifacts even if another search job failed.
# Community sources: public Islamic-topic hashtags and Arabic feeds; no author religion is inferred.
# Arabic/Urdu packet and code labels are recognized in any feed; eligibility rules stay the same.
# Durable outbox in the existing delivery state: max 200 findings per category.
# Publisher starts after the searches; imports their artifacts, then consumes the durable queue for up to 240 seconds.
# Affiliate message after every 10 confirmed new giveaways per language; durable receipts prevent repeats.
# Independent per-language quotas: 15 packet/quiz posts, 15 codes, 5 verified live alerts. RU/EN batches alternate.
# After setting both topic secrets, run telegram_test to check the two topics, then publish to enable this configuration.
# Queue rounds: one packet/quiz, one code, one live alert; keep all categories moving.
# Search checkpoints stay local; final/partial results are uploaded even after a failed search.
# Artifact transfers retry up to 3 times with 10/30-second pauses; only the publisher writes repository state.
# Deferred findings remain queued; codes still require an original post from the last 10 minutes.
# The publisher rechecks each original and every live badge/room immediately before sending.
# Cloudflare clock dispatches mode=scheduled; it never enables a different Telegram destination.
# One delivery history across sources: post IDs, published codes and explicit packet IDs.
# A positively different packet on a reused post gets a separate receipt; the old receipt is preserved.
# Code discovery reads both global feeds, recommendations and all eight giveaway tags.
# Empty queues include examples of already-sent messages; code freshness counts are reported.
# Missing identity in anonymous original details is not treated as a changed packet.
# Unsent stale rejections can be revalidated; sent and uncertain records remain blocked.
# Keyword API failures are reported; matching feed posts are also checked via original details.
# Live alerts require the public liveRedEnvelopeInfo.isDisplay badge and a currently live room.
# Live queue retention: 10 minutes; badge and room rechecked immediately before every send.
# Reward coins are displayed as metadata-derived hashtags; live alerts use #LIVE and #ПРЯМОЙ_ЭФИР.
# public_feed retains eligible findings for the web/Telegram Mini App independently of Telegram delivery.
# A live badge does not verify the reward amount or eligibility. No Binance login is used.
name: Red Packets to Telegram · parallel search
run-name: ${{ (github.event_name == 'schedule' || inputs.mode == 'scheduled') && 'Red Packets · automatic' || format('Red Packets · {0}', inputs.mode) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = parallel findings; telegram_test = test bot; publish = enable posting; scheduled = timer only"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - telegram_test
          - publish
          - scheduled
  schedule:
    - cron: '3/5 * * * *'

permissions:
  contents: read

# Queue new cycles before they start, so replacing a pending run cannot strand
# already-produced artifacts behind a busy publisher. Searches within a cycle stay parallel.
concurrency:
  group: square-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search:
    name: Square · ${{ matrix.worker }}
    if: github.ref_name == github.event.repository.default_branch && inputs.mode != 'telegram_test'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        worker: [posts, codes, authors, live, community]
    concurrency:
      group: square-search-${{ matrix.worker }}
      cancel-in-progress: false
    steps:
      - name: Read repository state snapshot
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Search Square and save local findings
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          ENABLE_GATE_LIVE: "1"
          WORKER_ROLE: ${{ matrix.worker }}
          SQUARE_STATE_SNAPSHOT: .redpacket/delivery.json
          SQUARE_RESULT_DIR: redpacket-results
