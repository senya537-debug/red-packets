          const REGIONAL_CODE_LABEL = '(?:(?:ال)?(?:رمز|كود)(?:\\s*(?:الظرف|المظروف|الحزمة)\\s*(?:الأحمر|الاحمر|الحمراء))?|(?:ریڈ\\s*پیکٹ\\s*)?کوڈ)';
