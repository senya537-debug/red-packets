# GitHub: replace .github/workflows/square_access_check.yml with this file.
# Repository Secrets: TG_BOT_TOKEN, TG_CHAT_ID. Optional: TG_THREAD_ID.
# Run telegram_test first. Run publish manually to enable automatic posting.
# Preview and test never enable the schedule. No Binance account/API keys needed.
# Deduplication state is saved in .redpacket/delivery.json before sending.
# Public state contains hashed destination, post IDs and delivery status, no tokens.
# Uncertain sends are not automatically repeated; check the group before resetting.
# State writes retry conflicts with a three-way merge and recheck the delivery claim.
# Standard Ubuntu runner in a public repository; schedule may be delayed/dropped.
# Text codes: last 10 minutes of the original Square post only.
# Square quizzes/Claim: require open flags and a future expiry, regardless of post age.
# Telegram is a fallback: only numeric Binance originals, never standalone competitor codes.
# Optional repository Variable TELEGRAM_DISCOVERY_ENABLED=false disables Telegram discovery.
# Also reads a bounded latest-post feed and remembered packet authors without tags.
# Linked Telegram finds are enriched from Binance; competitor names/links are not published.
# Delivery prefers 4 independently found Square posts and 1 verified Telegram discovery per batch.
# Cloudflare clock dispatches mode=scheduled; it never enables a different Telegram destination.
# One delivery history across sources: post IDs, published codes and explicit packet IDs.
# Keyword API failures are reported; matching feed posts are also checked via original details.
# Live alerts require the public liveRedEnvelopeInfo.isDisplay badge and a currently live room.
# A live badge does not verify the reward amount or eligibility. No Binance login is used.
name: Red Packets to Telegram
run-name: ${{ (github.event_name == 'schedule' || inputs.mode == 'scheduled') && 'Red Packets · automatic' || format('Red Packets · {0}', inputs.mode) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = findings; telegram_test = test bot; publish = enable posting; scheduled = timer only"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - telegram_test
          - publish
          - scheduled
  schedule:
    - cron: '3/5 * * * *'

permissions:
  contents: write

concurrency:
  group: square-telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find packets and post to Telegram
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_DISCOVERY_ENABLED: ${{ vars.TELEGRAM_DISCOVERY_ENABLED || 'true' }}
        run: |
          node --input-type=module <<'JS'
          const TAGS = ["redpacket", "redpacketgiveawaycampaign", "cryptobox", "binanceredpacket", "redpacketmission"];
          const TELEGRAM_SOURCES = ["SBCryptoz", "binance_red_packetz"];
          const SEARCH_TERMS = ['Red Packet Quiz','Red Packet','🧧','🎁'];
          const LIVE_HOST_UIDS = ['CeJ9rMnk2XCPrWM2j3Cz2w'];
          const SEARCH_DETAIL_LIMIT = 12;
          const LIVE_DETAIL_LIMIT = 8;
          const LIVE_CHECK_MAX_AGE_MS = 90 * 1000;
          const ENDPOINT = "https://www.binance.com/bapi/composite/v4/friendly/pgc/content/queryByHashtag";
          const PAGE_SIZE = 50;
          const LATEST_PAGES = 3;
          const AUTHOR_LIMIT = 6;
          const AUTHOR_MEMORY_LIMIT = 30;
          const MAX_POSTS_PER_RUN = 5;
          const POST_MAX_AGE_MS = 10 * 60 * 1000;
          
          function epoch(value) {
            const n = Number(value);
            return Number.isFinite(n) && n > 0 ? (n < 1e12 ? n * 1000 : n) : null;
          }
          function iso(value) { const n = epoch(value); return n ? new Date(n).toISOString() : null; }
          function codesFrom(text) {
            // Published candidates only; no guessing. All-letter codes are supported.
            const candidates = new Set();
            const label = /(?:red\s*packet\s*code|crypto\s*box\s*code|код(?:\s+(?:пакета|ред\s*пакета))?|c[oó]digo|code)\s*[:：=\-]\s*[`'"*]*(?![A-Za-z0-9]{9})([A-Za-z0-9]{8})\b/giu;
            for (const m of text.matchAll(label)) candidates.add(m[1]);
            if (/red\s*packet|crypto\s*box|红包|ред\s*пакет|sobre\s*rojo/i.test(text)) {
              for (const line of text.split(/\r?\n/)) {
                const m = line.trim().match(/^[`'"*]*([A-Za-z0-9]{8})[`'"*]*$/);
                if (m) candidates.add(m[1]);
              }
            }
            return [...candidates];
          }
          function packetState(envelope, now) {
            if (!envelope) return "unverified_code";
            if (envelope.isRunOut === true) return "run_out";
            if ([envelope.availableAmount,envelope.availableNumber].some(v => v !== null && v !== undefined && Number.isFinite(Number(v)) && Number(v) <= 0)) return "run_out";
            if (envelope.isExpired === true || (epoch(envelope.expiredTime) && epoch(envelope.expiredTime) <= now)) return "expired";
            if (envelope.isExpired === false && envelope.isRunOut === false && epoch(envelope.expiredTime) > now) return "reported_open";
            return "unknown";
          }
          function postText(post) {
            let text=typeof post?.bodyTextOnly==='string' ? post.bodyTextOnly : typeof post?.content==='string' ? post.content : '';
            try {const parsed=JSON.parse(text);if(typeof parsed?.richtext==='string')text=parsed.richtext;} catch {}
            return String(post?.title||'')+'\n'+text;
          }
          export function searchMarkers(post) {
            const text=postText(post);
            return SEARCH_TERMS.filter(term=>term==='Red Packet Quiz' ? /red\s*packet\s*quiz/i.test(text) :
              term==='Red Packet' ? /red\s*packet|crypto\s*box|红包|красн\S*\s+(?:пакет|конверт)|ред\s*пакет/i.test(text) : text.includes(term));
          }
          export async function fetchKeyword(term) {
            const response=await fetch('https://www.binance.com/bapi/composite/v2/friendly/pgc/feed/search/list',{
              method:'POST',signal:AbortSignal.timeout(10000),headers:{Accept:'application/json','Content-Type':'application/json',
                'User-Agent':'Mozilla/5.0',clienttype:'web',versioncode:'2.61.0',Referer:'https://www.binance.com/en/square/search?s='+encodeURIComponent(term)},
              body:JSON.stringify({scene:'web',pageIndex:1,pageSize:20,searchContent:term,type:1})});
            const data=await response.json().catch(()=>null);
            if(!response.ok || data?.success!==true)throw new Error('Square search HTTP '+response.status+'; '+String(data?.message||'request failed').slice(0,100));
            if(!Array.isArray(data.data?.vos))throw new Error('Square search response changed');
            return data.data.vos;
          }
          async function fetchOriginal(id) {
            if(!/^\d+$/.test(String(id)))throw new Error('Invalid Square post ID');
            const response=await fetch(`https://www.binance.com/bapi/composite/v3/friendly/pgc/content/${id}`,{
              signal:AbortSignal.timeout(10000),headers:{Accept:'application/json','User-Agent':'Mozilla/5.0',clienttype:'web',
                Referer:`https://www.binance.com/en/square/post/${id}`}});
            if(!response.ok)throw new Error('Square post detail HTTP '+response.status);
            const data=await response.json();
            if(data.success!==true || String(data.data?.id)!==String(id))throw new Error('Square post detail response changed');
            return data.data;
          }
          export function normalizeLive(post,room,now=Date.now()) {
            const id=String(post?.id||post?.contentId||'');
            if(!/^\d+$/.test(id) || post?.liveRedEnvelopeInfo?.isDisplay!==true ||
              post.liveStatus!==1 || room?.liveStatus!==1 || String(room.contentId)!==id)return null;
            return {post_id:id,live_id:id,kind:'live',status:'live_badge',discovery_kind:'square',source_kind:'square',
              url:'https://www.binance.com/en/square/audio?id='+id,author:room.userInfo?.displayName||post.displayName||post.authorName||'',
              author_id:room.userInfo?.squareUid||post.squareUid||post.squareAuthorId||'',title:room.title||post.title||'',
              published_at:iso(room.liveStartTime||post.firstReleaseTime||post.date),live_checked_at:new Date(now).toISOString(),
              live_badge:true,reward_verified:false,expires_at:null,published_codes:[],sources:['square:live']};
          }
          async function fetchLiveCatalog() {
            const response=await fetch('https://www.binance.com/bapi/composite/v1/friendly/pgc/feed/audio-live-recommend/list',{
              method:'POST',signal:AbortSignal.timeout(10000),headers:{Accept:'application/json','Content-Type':'application/json',
                'User-Agent':'Mozilla/5.0',clienttype:'web'},body:JSON.stringify({scene:'web-homepage'})});
            if(!response.ok)throw new Error('Square live catalog HTTP '+response.status);
            const data=await response.json();
            if(data.success!==true || !Array.isArray(data.data?.spaceLiveList))throw new Error('Square live catalog response changed');
            return data.data.spaceLiveList;
          }
          async function fetchLiveRoom(id) {
            const response=await fetch('https://www.binance.com/bapi/square/v2/friendly/square-live/space/room-detail?contentId='+id,
              {signal:AbortSignal.timeout(10000),headers:{Accept:'application/json','User-Agent':'Mozilla/5.0',clienttype:'web'}});
            if(!response.ok)throw new Error('Square live detail HTTP '+response.status);
            const data=await response.json();
            if(data.success!==true || String(data.data?.contentId)!==String(id))throw new Error('Square live detail response changed');
            return data.data;
          }
          export async function refreshLive(post) {
            const feed=await fetchAuthor(post.author_id),original=feed.find(p=>String(p.id)===post.live_id);
            if(!original || original.liveRedEnvelopeInfo?.isDisplay!==true || original.liveStatus!==1)return null;
            return normalizeLive(original,await fetchLiveRoom(post.live_id));
          }
          export function normalize(post, tag, now = Date.now()) {
            if (!post || typeof post !== "object" || !/^\d+$/.test(String(post.id || ""))) return null;
            if(post.extraFeature==='SPACE_LIVE' || (post.contentType===4 && post.liveType>0))return null;
            let text = typeof post.bodyTextOnly==='string' ? post.bodyTextOnly : typeof post.content === "string" ? post.content : "";
            try {const parsed=JSON.parse(text);if(typeof parsed?.richtext==='string')text=parsed.richtext;} catch {}
            const envelope = post.redEnvelop && typeof post.redEnvelop === "object" ? post.redEnvelop : null;
            const codes = codesFrom(text);
            if (!envelope && !codes.length) return null;
            const quiz = envelope?.quiz || "";
            const answerMatch = text.match(/(?:^|\n)\s*(?:ans(?:wer)?|ответ|respuesta)\s*[:：]\s*([^\n]{1,120})/i);
            return {
              post_id: String(post.id),
              packet_id: envelope?.orderId == null || String(envelope.orderId)==='0' ? null : String(envelope.orderId),
              packet_code: /^[A-Za-z0-9]{8}$/.test(String(envelope?.grabCode||'')) ? String(envelope.grabCode) : null,
              discovery_kind: tag.startsWith('telegram:') ? 'telegram' : 'square',
              author: post.authorName || post.displayName || post.username || "",
              author_id: post.squareAuthorId || post.squareUid || "",
              url: `https://www.binance.com/en/square/post/${post.id}`,
              published_at: iso(post.date ?? post.firstReleaseTime ?? post.createTime ?? post.latestReleaseTime),
              sources: [tag],
              kind: envelope ? (envelope.type === 1 || quiz ? "quiz" : "packet") : "code",
              status: packetState(envelope, now),
              currency: envelope?.currency || null,
              expires_at: iso(envelope?.expiredTime),
              question: quiz,
              hint: envelope?.answerHint || "",
              answer_from_metadata: envelope?.answer ?? null,
              answer_claimed_in_post: answerMatch ? answerMatch[1].trim() : null,
              answer_verified: false,
              published_codes: codes,
              // null stays null: an unavailable reward amount is never treated as zero.
              amount: envelope?.amount ?? null,
              available_amount: envelope?.availableAmount ?? null,
              available_receivers: envelope?.availableNumber ?? null,
              eligibility: "not_checked",
              excerpt: text.slice(0, 240),
            };
          }
          async function fetchTag(tag) {
            const url = new URL(ENDPOINT);
            url.search = new URLSearchParams({hashtag: `#${tag}`, pageIndex: "1", pageSize: String(PAGE_SIZE), orderBy: "LATEST"});
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            try {
              const response = await fetch(url, {
                headers: {
                  Accept: "application/json, text/plain, */*",
                  "Accept-Language": "en-US,en;q=0.9",
                  Referer: `https://www.binance.com/en/square/hashtag/${tag}`,
                  clienttype: "web",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36",
                },
                signal: controller.signal,
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const payload = await response.json();
              if (payload.success !== true || !Array.isArray(payload.data?.feedData)) {
                throw new Error("Square response changed or public access is unavailable");
              }
              return payload.data.feedData;
            } finally { clearTimeout(timer); }
          }
          function decodeHtml(text) {
            return String(text).replace(/&#(x[0-9a-f]+|\d+);/gi,(_,n) => {
              const value=n[0].toLowerCase()==='x' ? parseInt(n.slice(1),16) : Number(n);
              return value>0 && value<=0x10ffff ? String.fromCodePoint(value) : '';
            }).replace(/&(?:amp|lt|gt|quot|apos|nbsp);/g,s=>({'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&apos;':"'",'&nbsp;':' '}[s]));
          }
          function squareLinkFrom(html) {
            for (const m of html.matchAll(/href="([^"]+)"/g)) {
              try {
                const url=new URL(decodeHtml(m[1]));
                if (url.protocol!=='https:' || !['www.binance.com','binance.com','app.binance.com'].includes(url.hostname)) continue;
                const id=url.pathname.match(/\/(?:square\/post|uni-qr\/cpos)\/(\d+)(?:\/|$)/)?.[1];
                if (id) return {id,url:`https://www.binance.com/en/square/post/${id}`};
              } catch {}
            }
            return null;
          }
          export function parseTelegramPreview(html, channel) {
            if (!/tgme_widget_message/.test(html)) throw new Error('Public Telegram preview unavailable or no messages visible');
            const chunks=html.split(/(?=<div\b[^>]*\bdata-post=")/);
            const found=[];
            for (const chunk of chunks) {
              const ref=chunk.match(/\bdata-post="([A-Za-z0-9_]+)\/(\d+)"/);
              if (!ref || ref[1].toLowerCase()!==channel.toLowerCase()) continue;
              const stamp=chunk.match(/<time\b[^>]*\bdatetime="([^"]+)"/)?.[1];
              if (!stamp || !Number.isFinite(Date.parse(stamp))) continue;
              const body=chunk.match(/<div\b[^>]*class="[^"]*tgme_widget_message_text[^"\n]*"[^>]*>([\s\S]*?)<\/div>/)?.[1];
              if (!body) continue;
              const text=decodeHtml(body.replace(/<br\s*\/?\s*>/gi,'\n').replace(/<[^>]*>/g,''));
              const link=squareLinkFrom(body);
              const answer=text.match(/(?:^|\n)\s*(?:ans(?:wer)?|ответ)\s*[:：]\s*([^\n]{1,160})/i)?.[1]?.trim();
              const common={author:channel,source_kind:'telegram',source_url:`https://t.me/${channel}/${ref[2]}`,
                published_at:new Date(stamp).toISOString(),sources:['telegram:'+channel],currency:null,expires_at:null,
                question:'',hint:'',answer_from_metadata:null,answer_claimed_in_post:answer||null,answer_verified:false,
                amount:null,published_codes:[],excerpt:text.slice(0,240)};
              if (link) found.push({...common,post_id:link.id,url:link.url,
                kind:answer?'quiz_answer':'packet_link',status:'unverified_link'});
              else if (!answer) {
                const codes=codesFrom('Red Packet\n'+text);
                if (codes.length) found.push({...common,post_id:`tg_${channel}_${ref[2]}`,url:common.source_url,
                  kind:'code',status:'unverified_code',published_codes:codes});
              }
            }
            return found;
          }
          async function fetchTelegram(channel) {
            const response=await fetch(`https://t.me/s/${channel}`,{redirect:'follow',signal:AbortSignal.timeout(10000),
              headers:{'User-Agent':'Mozilla/5.0','Accept':'text/html'}});
            if (!response.ok) throw new Error('Telegram preview HTTP '+response.status);
            return parseTelegramPreview(await response.text(),channel);
          }
          async function fetchLatest() {
            const posts=[];
            for (let page=1;page<=LATEST_PAGES;page++) {
              const url=new URL('https://www.binance.com/bapi/composite/v3/friendly/pgc/content/article/list');
              url.search=new URLSearchParams({pageIndex:String(page),pageSize:String(PAGE_SIZE),type:'2'});
              const response=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{Accept:'application/json',
                'User-Agent':'Mozilla/5.0','clienttype':'web',Referer:'https://www.binance.com/en/square'}});
              if(!response.ok)throw new Error('Square latest HTTP '+response.status);
              const data=await response.json();
              if(data.success!==true || !Array.isArray(data.data?.vos))throw new Error('Square latest response changed');
              posts.push(...data.data.vos);
              if(data.data.vos.length<PAGE_SIZE)break;
            }
            return posts;
          }
          async function fetchAuthor(uid) {
            const url=new URL('https://www.binance.com/bapi/composite/v9/friendly/pgc/content/queryUserProfilePageContents');
            url.search=new URLSearchParams({targetSquareUid:uid,timeOffset:'-1'});
            const response=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{Accept:'application/json',
              'User-Agent':'Mozilla/5.0','clienttype':'web',Referer:'https://www.binance.com/en/square'}});
            if(!response.ok)throw new Error('Square author HTTP '+response.status);
            const data=await response.json();
            if(data.success!==true || !Array.isArray(data.data?.contents))throw new Error('Square author response changed');
            return data.data.contents;
          }
          export async function enrichTelegramCandidate(item,now=Date.now()) {
            if(!/^\d+$/.test(item.post_id||''))return null;
            if(!isFreshPost(item,now))return null;
            const original=normalize(await fetchOriginal(item.post_id),item.sources?.[0]||'telegram:discovery',now);
            if(!original)return null;
            return {...original,source_kind:'square',discovery_kind:'telegram',
              answer_claimed_in_post:item.answer_claimed_in_post||original.answer_claimed_in_post,
              answer_published_at:item.published_at};
          }
          export function mergeAuthors(...lists) {
            const authors=new Map();
            for(const item of lists.flat()) {
              if(!item || !/^[A-Za-z0-9_-]{8,80}$/.test(item.uid||''))continue;
              const old=authors.get(item.uid);
              const stamp=Number(item.last_packet_at)||0;
              authors.set(item.uid,{uid:item.uid,name:String((!old || stamp>=old.last_packet_at?item.name:old.name)||'').slice(0,80),
                last_packet_at:Math.max(stamp,old?.last_packet_at||0),last_checked_at:Math.max(Number(item.last_checked_at)||0,old?.last_checked_at||0)});
            }
            return [...authors.values()].sort((a,b)=>b.last_packet_at-a.last_packet_at).slice(0,AUTHOR_MEMORY_LIMIT);
          }
          export function chooseAuthors(authors) {
            const newest=authors.slice(0,2);
            const others=authors.slice(2).sort((a,b)=>(a.last_checked_at||0)-(b.last_checked_at||0) || b.last_packet_at-a.last_packet_at);
            return [...newest,...others].slice(0,AUTHOR_LIMIT);
          }
          export async function scan(env=process.env) {
            const now = Date.now();
            const feeds=[...TAGS.map(tag=>({tag,coverage:'first_latest_page_only',run:()=>fetchTag(tag)})),
              {tag:'square:latest',coverage:'latest_first_3_pages_only',run:fetchLatest},
              ...SEARCH_TERMS.map(term=>({tag:'square:search:'+term,coverage:'first_search_page_only',run:()=>fetchKeyword(term)})),
              {tag:'square:live:catalog',coverage:'recommended_live_rooms_only',run:fetchLiveCatalog}];
            const results = await Promise.allSettled(feeds.map(feed=>feed.run()));
            const posts = new Map();
            const markerPosts=new Map(),liveSeeds=new Map();
            const sourceChecks = [];
            const observedAuthors=[];
            function ingest(post,source) {
              const id=String(post?.id||post?.contentId||'');
              if(/^\d+$/.test(id) && post?.liveRedEnvelopeInfo?.isDisplay===true && post.liveStatus===1)liveSeeds.set(id,post);
              const item=normalize(post,source,now);
              if(!item) {
                if(/^\d+$/.test(id) && post?.extraFeature!=='SPACE_LIVE' && !(post?.contentType===4 && post.liveType>0) && searchMarkers(post).length)markerPosts.set(id,post);
                return;
              }
              if(item.author_id)observedAuthors.push({uid:item.author_id,name:item.author,last_packet_at:Date.parse(item.published_at)||0});
              const previous=posts.get(item.post_id);
              if(previous) {
                if(['expired','run_out'].includes(item.status))previous.status=item.status;
                previous.sources=[...new Set([...previous.sources,source])].sort();
              } else posts.set(item.post_id,item);
            }
            for (let i = 0; i < results.length; i++) {
              const result = results[i], tag = feeds[i].tag;
              if (result.status !== "fulfilled") {
                sourceChecks.push({tag, ok: false, error: String(result.reason?.message || result.reason)});
                continue;
              }
              const feed = result.value;
              const dates = feed.map(p => epoch(p.date)).filter(Boolean);
              sourceChecks.push({tag, ok: true, posts_checked: feed.length,
                newest_post_at: dates.length ? iso(Math.max(...dates)) : null,
                oldest_post_at: dates.length ? iso(Math.min(...dates)) : null,
                coverage: feeds[i].coverage, may_have_more: feed.length >= PAGE_SIZE});
              for (const post of feed) {
                ingest(post,tag);
              }
            }
            let remembered=[],keywordChecks={};
            if(env.GITHUB_REPOSITORY && env.GITHUB_REF_NAME && env.GH_STATE_TOKEN) {
              try {const memory=await new GitHubState(env).load();remembered=Array.isArray(memory.authors)?memory.authors:[];
                keywordChecks=memory.keyword_checks && typeof memory.keyword_checks==='object' && !Array.isArray(memory.keyword_checks) ? memory.keyword_checks : {};}
              catch(error){sourceChecks.push({tag:'authors:memory',ok:false,error:redact(error,env)});}
            }
            const authors=chooseAuthors(mergeAuthors(observedAuthors,remembered));
            for(const uid of LIVE_HOST_UIDS)if(!authors.some(a=>a.uid===uid))authors.push({uid,name:'Live host',last_packet_at:0,last_checked_at:0});
            const authorResults=await Promise.allSettled(authors.map(a=>fetchAuthor(a.uid)));
            for(let i=0;i<authorResults.length;i++) {
              const result=authorResults[i],source='author:'+authors[i].uid;
              if(result.status!=='fulfilled') {
                sourceChecks.push({tag:source,ok:false,error:String(result.reason?.message||result.reason)});continue;
              }
              sourceChecks.push({tag:source,author:authors[i].name,ok:true,posts_checked:result.value.length,coverage:'first_author_page_only'});
              for(const post of result.value)ingest(post,source);
            }
            const detailPosts=[...markerPosts.values()].filter(p=>!posts.has(String(p.id))).sort((a,b)=>
              (Number(keywordChecks[a.id])||0)-(Number(keywordChecks[b.id])||0) ||
              (epoch(b.date??b.firstReleaseTime??b.createTime)||0)-(epoch(a.date??a.firstReleaseTime??a.createTime)||0)).slice(0,SEARCH_DETAIL_LIMIT);
            let markerVerified=0;
            for(let start=0;start<detailPosts.length;start+=4) {
              const batch=detailPosts.slice(start,start+4),details=await Promise.allSettled(batch.map(p=>fetchOriginal(p.id)));
              for(let i=0;i<details.length;i++) {
                const result=details[i];
                if(result.status==='fulfilled') {
                  keywordChecks[String(batch[i].id)]=now;
