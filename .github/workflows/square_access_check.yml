      - name: Upload search result
        id: upload_result_1
        if: ${{ !cancelled() && inputs.mode != 'preview' && hashFiles('redpacket-results/*.json') != '' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with: &search_artifact_options
          name: square-result-${{ github.run_id }}-${{ matrix.worker }}
          path: redpacket-results/${{ matrix.worker }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Wait before second upload attempt
        if: ${{ !cancelled() && steps.upload_result_1.outcome == 'failure' }}
        run: sleep 10
      - name: Upload search result · attempt 2
        id: upload_result_2
        if: ${{ !cancelled() && steps.upload_result_1.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with: *search_artifact_options
      - name: Wait before final upload attempt
        if: ${{ !cancelled() && steps.upload_result_2.outcome == 'failure' }}
        run: sleep 30
      - name: Upload search result · attempt 3
        id: upload_result_3
        if: ${{ !cancelled() && steps.upload_result_2.outcome == 'failure' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with: *search_artifact_options

  publish:
    name: Telegram · publisher
    needs: search
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.mode != 'preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: square-telegram-publisher
      cancel-in-progress: false
    steps:
      - name: Download results from this workflow run
        id: download_result_1
        if: ${{ inputs.mode != 'telegram_test' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: &download_artifact_options
          pattern: square-result-${{ github.run_id }}-*
          path: redpacket-results
          merge-multiple: true
      - name: Wait before second download attempt
        if: ${{ !cancelled() && steps.download_result_1.outcome == 'failure' }}
        run: sleep 10
      - name: Download search results · attempt 2
        id: download_result_2
        if: ${{ !cancelled() && steps.download_result_1.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: *download_artifact_options
      - name: Wait before final download attempt
        if: ${{ !cancelled() && steps.download_result_2.outcome == 'failure' }}
        run: sleep 30
      - name: Download search results · attempt 3
        id: download_result_3
        if: ${{ !cancelled() && steps.download_result_2.outcome == 'failure' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with: *download_artifact_options
      - name: Report unavailable search results
        if: ${{ !cancelled() && steps.download_result_3.outcome == 'failure' }}
        run: |
          echo '::error::Search artifact download failed after 3 attempts. Only the existing durable queue will be processed.'
          exit 1
      - name: Publish ready queue entries
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          ENABLE_GATE_LIVE: "1"
          WORKER_ROLE: publisher
          SQUARE_RESULT_DIR: ${{ (steps.download_result_1.outcome == 'success' || steps.download_result_2.outcome == 'success' || steps.download_result_3.outcome == 'success') && 'redpacket-results' || 'redpacket-results-unavailable' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_RU_THREAD_ID: ${{ secrets.TG_RU_THREAD_ID }}
          TG_EN_THREAD_ID: ${{ secrets.TG_EN_THREAD_ID }}
          GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: *square_runtime
