              if(targets.some(target=>{
                const reason=deliverySkipReason(latest,matchingDeliveries(deliveryIndex(latest,target.destination),candidate));
                return budgets[target.language].used[queue]>=budgets[target.language].limits[queue] && (!reason||reason==='previously_stale');
