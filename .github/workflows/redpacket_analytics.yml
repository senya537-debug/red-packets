name: Red Packet Analytics

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-packet-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Read the public feed from the state branch
        run: |
          # The feed lives on the state branch, so the code branch stays small. Keep it outside the working tree
          # so the later rebase has nothing to complain about.
          git fetch --quiet --depth 1 origin state
          git show FETCH_HEAD:.redpacket/public_feed.json > "$RUNNER_TEMP/public_feed.json"

      - name: Build analytics from public feed
        env:
          FEED_PATH: ${{ runner.temp }}/public_feed.json
        run: node scripts/redpacket-analytics.mjs

      - name: Commit analytics data
        run: |
          if git diff --quiet -- .redpacket/analytics_history.json .redpacket/analytics.json; then
            echo "Analytics unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .redpacket/analytics_history.json .redpacket/analytics.json
          git commit -m "Update Red Packet analytics [skip ci]"
          git pull --rebase origin main
          git push
