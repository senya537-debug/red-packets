name: Probe Square search (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-search.mjs | tee probe.txt
      - run: cat probe.txt >> "$GITHUB_STEP_SUMMARY"
