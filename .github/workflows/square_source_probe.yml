name: Square source diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/square_source_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public profile search API
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const uid='CeJ9rMnk2XCPrWM2j3Cz2w';
          const queries=[{squareUid:uid,pageNum:1,pageSize:20},{squareUid:uid,pageNum:1,pageSize:20,keyword:''},{squareUid:uid,pageNum:1,pageSize:20,keyword:'红包'},{squareUid:'LeglHZ13lS0epY5vhHGESg',pageNum:1,pageSize:20}];
          await Promise.all(queries.map(async body=>{
           try{const r=await fetch('https://www.binance.com/bapi/composite/v2/friendly/pgc/content/search',{method:'POST',signal:AbortSignal.timeout(15000),headers:{Accept:'application/json','Content-Type':'application/json','User-Agent':'Mozilla/5.0',clienttype:'web',Referer:'https://www.binance.com/en/square'},body:JSON.stringify(body)});
           const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{}
           console.log(JSON.stringify({body,status:r.status,waf:r.headers.get('x-amzn-waf-action'),bytes:raw.length,success:d?.success,code:d?.code,message:d?.message,dataKeys:d?.data&&Object.keys(d.data),data:raw.slice(0,14000)}));
           }catch(e){console.log(JSON.stringify({body,error:e.message}));}
          }));
          JS
