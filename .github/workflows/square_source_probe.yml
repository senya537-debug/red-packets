name: Square source diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/square_source_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check current public filtered profile API
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://www.binance.com/bapi/composite/v2/friendly/pgc/content/queryUserProfilePageContentsWithFilter';
          const queries=[{targetSquareUid:'CeJ9rMnk2XCPrWM2j3Cz2w',timeOffset:'-1',filterType:'ALL'},{username:'Puppieswillwin',timeOffset:'-1',filterType:'ALL'},{targetSquareUid:'LeglHZ13lS0epY5vhHGESg',timeOffset:'-1',filterType:'ALL'},{username:'Square-Creator-4774b2ff948a',timeOffset:'-1',filterType:'ALL'}];
          await Promise.all(queries.map(async params=>{
           try{const r=await fetch(base+'?'+new URLSearchParams(params),{signal:AbortSignal.timeout(15000),headers:{Accept:'application/json','User-Agent':'Mozilla/5.0',clienttype:'web',Referer:'https://www.binance.com/en/square'}});
           const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{}
           console.log(JSON.stringify({params,status:r.status,waf:r.headers.get('x-amzn-waf-action'),bytes:raw.length,success:d?.success,code:d?.code,message:d?.message,dataKeys:d?.data&&Object.keys(d.data),posts:d?.data?.contents?.length,first:d?.data?.contents?.[0],empty:raw.length<500?raw:undefined}));
           }catch(e){console.log(JSON.stringify({params,error:e.message}));}
          }));
          JS
